<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rock Paper Scissors</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#1e1e2f,#3a3a5a);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
    background:rgba(0,0,0,0.4);
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

h1{
    margin-bottom:10px;
}

.buttons button{
    padding:15px 20px;
    margin:10px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
}

.rock{background:#ff4d4d;color:white;}
.paper{background:#4da6ff;color:white;}
.scissors{background:#4dff88;color:black;}

.result{
    margin-top:20px;
    font-size:20px;
}

.score{
    margin-top:15px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="container">
    <h1>Rock Paper Scissors 🎮</h1>

    <div class="buttons">
        <button class="rock" onclick="play('rock')">Rock</button>
        <button class="paper" onclick="play('paper')">Paper</button>
        <button class="scissors" onclick="play('scissors')">Scissors</button>
    </div>

    <div class="result" id="result">Make your move!</div>
    <div class="score" id="score">You: 0 | Computer: 0</div>
</div>

<script>
let userScore = 0;
let computerScore = 0;

function play(userChoice){
    const choices = ["rock", "paper", "scissors"];
    const computerChoice = choices[Math.floor(Math.random() * 3)];

    let resultText = "";

    if(userChoice === computerChoice){
        resultText = "It's a draw!";
    }
    else if(
        (userChoice === "rock" && computerChoice === "scissors") ||
        (userChoice === "paper" && computerChoice === "rock") ||
        (userChoice === "scissors" && computerChoice === "paper")
    ){
        userScore++;
        resultText = "You win! 🎉";
    }
    else{
        computerScore++;
        resultText = "Computer wins! 💻";
    }

    document.getElementById("result").innerText =
        `You chose ${userChoice}, Computer chose ${computerChoice}. ${resultText}`;

    document.getElementById("score").innerText =
        `You: ${userScore} | Computer: ${computerScore}`;
}
</script>

</body>
</html>
